[pytest]
# Only the agent's own tests run from the repository root.
# The sample project has its own pytest.ini so that:
#   cd sample_project && python -m pytest -q
# runs the (intentionally failing) tests the agent is meant to fix.
testpaths = tests
# The agent's tests are all functions; an empty value stops pytest from trying
# to collect imported helper classes such as TestRunnerError.
python_classes =
